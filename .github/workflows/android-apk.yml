
name: YouPI-PG Universal Release APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youpi-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Sign Universal APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      # Use the SDK preinstalled on GitHub's Ubuntu runner.
      # Do not use android-actions/setup-android here:
      # its sdkmanager tools installation caused the previous failure.
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "Android SDK directory not found: $SDK"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found in $SDK/cmdline-tools"
            find "$SDK" -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          "$SDKMANAGER" --version

          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -o pipefail

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "Could not accept Android SDK licenses."
            exit 1
          fi

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="apps/android-observer-app"

          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/build.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/app/src/main/AndroidManifest.xml"

          echo "Android project files found."

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            -p apps/android-observer-app \
            :app:assembleRelease

      - name: Find Release APK
        id: find_apk
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="apps/android-observer-app/app/build/outputs/apk/release"

          if [ ! -d "$APK_DIR" ]; then
            echo "Release APK directory not found."
            find apps/android-observer-app/app/build/outputs \
              -type f -print || true
            exit 1
          fi

          mapfile -t APKS < <(
            find "$APK_DIR" -maxdepth 1 -type f -name "*.apk"
          )

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one APK for this universal build."
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi

          echo "apk_path=${APKS[0]}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "Missing GitHub Secret: KEYSTORE_BASE64"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/youpi-release.jks"

          test -s "$RUNNER_TEMP/youpi-release.jks"

      - name: Sign and verify APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          : "${STORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD}"

          TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          INPUT="${{ steps.find_apk.outputs.apk_path }}"
          OUTPUT_DIR="$GITHUB_WORKSPACE/release-output"
          ALIGNED="$RUNNER_TEMP/youpi-aligned.apk"
          SIGNED="$OUTPUT_DIR/YouPI-PG-universal-release.apk"

          mkdir -p "$OUTPUT_DIR"

          "$TOOLS/zipalign" -f -p 4 "$INPUT" "$ALIGNED"

          "$TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/youpi-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" \
            "$ALIGNED"

          "$TOOLS/apksigner" verify --verbose "$SIGNED"
          "$TOOLS/zipalign" -c -v 4 "$SIGNED"

          sha256sum "$SIGNED" \
            > "$SIGNED.sha256"

          echo "Signed APK created successfully."

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: YouPI-PG-Universal-Release-APK
          path: |
            release-output/YouPI-PG-universal-release.apk
            release-output/YouPI-PG-universal-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$GITHUB_REF_NAME" \
            release-output/YouPI-PG-universal-release.apk \
            release-output/YouPI-PG-universal-release.apk.sha256 \
            --title "YouPI-PG $GITHUB_REF_NAME" \
            --generate-notes
