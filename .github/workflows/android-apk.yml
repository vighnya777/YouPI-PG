
name: YouPI-PG Android Universal Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - "apps/android-observer-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youpi-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Sign Universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: apps/android-observer-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Check Android project
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Build release APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Locate unsigned release APK
        id: apk
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ ! -f "$APK" ]; then
            echo "Expected APK not found. Available APK files:"
            find app/build/outputs -type f -name "*.apk" || true
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "Missing GitHub Secret: KEYSTORE_BASE64"
            exit 1
          }

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/youpi-release.jks"

          test -s "$RUNNER_TEMP/youpi-release.jks"

      - name: Sign universal APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          APK="${{ steps.apk.outputs.path }}"
          SIGNED="$RUNNER_TEMP/YouPI-PG-universal-release.apk"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            "$APK" "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/youpi-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" \
            "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED"

          mkdir -p ../../release-output
          cp "$SIGNED" ../../release-output/YouPI-PG-universal-release.apk

      - name: Generate SHA256 checksum
        working-directory: .
        run: |
          cd release-output
          sha256sum YouPI-PG-universal-release.apk \
            > YouPI-PG-universal-release.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouPI-PG-Universal-Release-APK
          path: |
            release-output/YouPI-PG-universal-release.apk
            release-output/YouPI-PG-universal-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-output/YouPI-PG-universal-release.apk \
            release-output/YouPI-PG-universal-release.apk.sha256 \
            --title "YouPI-PG $GITHUB_REF_NAME" \
            --generate-notes
