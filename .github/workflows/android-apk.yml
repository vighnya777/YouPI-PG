name: YouPI-PG Universal Release APK

on:
  push:
    branches:
      - main
      - master
    paths:
      - "apps/android-observer-app/**"
      - ".github/workflows/android-apk.yml"
    tags-ignore:
      - "v*"

  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youpi-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, Sign and Publish APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      # Do not use android-actions/setup-android here.
      # It attempts to install the obsolete "tools" SDK package.
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK sdkmanager was not found."
            find "$ANDROID_HOME" -maxdepth 4 -type f \
              -name sdkmanager -print || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Validate Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f apps/android-observer-app/settings.gradle.kts
          test -f apps/android-observer-app/build.gradle.kts
          test -f apps/android-observer-app/app/build.gradle.kts
          test -f apps/android-observer-app/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            --stacktrace \
            -p apps/android-observer-app \
            :app:assembleRelease

      - name: Locate Release APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="apps/android-observer-app/app/build/outputs/apk/release"

          mapfile -t APKS < <(
            find "$APK_DIR" -maxdepth 1 -type f -name "*.apk"
          )

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one Release APK."
            find "$APK_DIR" -type f -print || true
            exit 1
          fi

          echo "path=${APKS[0]}" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYSTORE_BASE64 GitHub Secret."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/youpi-release.jks"

          test -s "$RUNNER_TEMP/youpi-release.jks"

      - name: Sign and verify APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          : "${STORE_PASSWORD:?Missing KEYSTORE_PASSWORD Secret}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS Secret}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD Secret}"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          INPUT_APK="${{ steps.apk.outputs.path }}"
          OUTPUT_DIR="release-output"
          ALIGNED_APK="$RUNNER_TEMP/youpi-aligned.apk"
          SIGNED_APK="$OUTPUT_DIR/YouPI-PG-universal-release.apk"

          mkdir -p "$OUTPUT_DIR"

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            "$INPUT_APK" "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/youpi-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS/apksigner" verify --verbose "$SIGNED_APK"

          "$BUILD_TOOLS/zipalign" -c -v 4 "$SIGNED_APK"

          sha256sum "$SIGNED_APK" \
            > "$OUTPUT_DIR/YouPI-PG-universal-release.apk.sha256"

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: YouPI-PG-Universal-Release-APK
          path: |
            release-output/YouPI-PG-universal-release.apk
            release-output/YouPI-PG-universal-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$GITHUB_REF_NAME" \
            release-output/YouPI-PG-universal-release.apk \
            release-output/YouPI-PG-universal-release.apk.sha256 \
            --title "YouPI-PG $GITHUB_REF_NAME" \
            --generate-notes
